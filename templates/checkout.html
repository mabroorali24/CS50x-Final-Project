{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <h2 class="mb-4 text-center">Checkout</h2>
  <div class="row g-5">
    
    <!-- Checkout Form -->
    <div class="col-md-7">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h4 class="mb-3">Billing & Shipping Information</h4>
          <form action="{{ url_for('products.place_order') }}" method="POST">
            
            <!-- Full Name -->
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" name="fullname" class="form-control" placeholder="Enter your full name" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <!-- Address -->
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea name="address" rows="3" class="form-control" placeholder="Enter your address" required></textarea>
            </div>

            <!-- Phone -->
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control" placeholder="03xxxxxxxxx" required>
            </div>

            <!-- Payment Method (only COD) -->
            <h5 class="mt-4">Payment Method</h5>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="payment" id="cod" value="COD" checked>
              <label class="form-check-label" for="cod">Cash on Delivery</label>
            </div>

            <!-- Place Order Button -->
            <button type="submit" class="btn btn-success w-100 mt-4">
              <i class="bi bi-bag-check"></i> Place Order
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Order Summary -->
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h4 class="mb-3">Order Summary</h4>
          <ul class="list-group mb-3">
            {% for item in products %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <h6 class="my-0">{{ item.product.name }}</h6>
                <small class="text-muted">Quantity: {{ item.quantity }}</small>
              </div>
              <span class="text-muted">${{ item.subtotal }}</span>
            </li>
            {% endfor %}
            <li class="list-group-item d-flex justify-content-between">
              <strong>Total</strong>
              <strong>${{ total }}</strong>
            </li>
          </ul>
        </div>
      </div>
    </div>

  </div>
</div>
{% endblock %}
