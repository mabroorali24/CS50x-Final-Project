{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <h2 class="mb-4">Add New Product</h2>
  <form method="POST" enctype="multipart/form-data">
    <!-- Product Name -->
    <div class="mb-3">
      <label class="form-label">Product Name</label>
      <input type="text" class="form-control" name="name" placeholder="e.g. Classic White Shirt" required>
    </div>

    <!-- Price -->
    <div class="mb-3">
      <label class="form-label">Price (PKR)</label>
      <input type="number" step="0.01" class="form-control" name="price" placeholder="e.g. 2500" required>
    </div>

    <!-- Description -->
    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" name="description" rows="3" placeholder="Enter product details like material, style, etc." required></textarea>
    </div>

    <!-- Category -->
    <div class="mb-3">
      <label class="form-label">Category</label>
      <select class="form-select" name="category" required>
        <option value="">-- Select Category --</option>
        <option value="Men">Men</option>
        <option value="Women">Women</option>
        <option value="Accessories">Accessories</option>
      </select>
    </div>

    <!-- Product Type -->
    <div class="mb-3">
      <label class="form-label">Product Type</label>
      <select class="form-select" name="product_type" required>
        <option value="">-- Select Type --</option>
        <option value="Shirt">Shirt</option>
        <option value="T-Shirt">T-Shirt</option>
        <option value="Pant">Pant</option>
        <option value="Jeans">Jeans</option>
        <option value="Shorts">Shorts</option>
        <option value="Shoes">Shoes</option>
        <option value="Bag">Bag</option>
        <option value="Watch">Watch</option>
        <option value="Dress">Dress</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <!-- Size Options -->
    <div class="mb-3">
      <label class="form-label">Available Sizes</label><br>
      {% for size in ["S","M","L","XL"] %}
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" name="sizes" value="{{ size }}">
        <label class="form-check-label">{{ size }}</label>
      </div>
      {% endfor %}
    </div>

    <!-- Color -->
    <div class="mb-3">
      <label class="form-label">Color</label>
      <input type="text" class="form-control" name="color" placeholder="e.g. Black, White, Blue">
    </div>

    <!-- Stock Status -->
    <div class="mb-3">
      <label class="form-label">Stock Status</label>
      <select class="form-select" name="stock" required>
        <option value="In Stock">In Stock</option>
        <option value="Out of Stock">Out of Stock</option>
      </select>
    </div>

    <!-- Image Upload -->
    <div class="mb-3">
      <label class="form-label">Upload Image</label>
      <input type="file" class="form-control" name="image">
    </div>

    <button type="submit" class="btn btn-primary">Add Product</button>
  </form>
</div>
{% endblock %}
