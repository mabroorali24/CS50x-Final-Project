{% extends "base.html" %}
{% block content %}
<div class="container my-5">
  <h2 class="mb-4 text-center">All Products</h2>

  <!-- ---------- Filter Section ---------- -->
  <div class="card mb-4 p-3 shadow-sm">
    <form method="GET" action="{{ url_for('products.shop') }}">
      <div class="row g-3 align-items-end">
        
        <!-- Category Filter -->
        <div class="col-md-3">
          <label class="form-label">Category</label>
          <select class="form-select" name="category">
            <option value="">All</option>
            <option value="Men" {% if request.args.get('category') == 'Men' %}selected{% endif %}>Men</option>
            <option value="Women" {% if request.args.get('category') == 'Women' %}selected{% endif %}>Women</option>
            <option value="Accessories" {% if request.args.get('category') == 'Accessories' %}selected{% endif %}>Accessories</option>
          </select>
        </div>

        <!-- Product Type Filter -->
        <div class="col-md-3">
          <label class="form-label">Product Type</label>
          <select class="form-select" name="product_type">
            <option value="">All</option>
            <option value="Shirt" {% if request.args.get('product_type') == 'Shirt' %}selected{% endif %}>Shirt</option>
            <option value="T-Shirt" {% if request.args.get('product_type') == 'T-Shirt' %}selected{% endif %}>T-Shirt</option>
            <option value="Pant" {% if request.args.get('product_type') == 'Pant' %}selected{% endif %}>Pant</option>
            <option value="Jeans" {% if request.args.get('product_type') == 'Jeans' %}selected{% endif %}>Jeans</option>
            <option value="Shorts" {% if request.args.get('product_type') == 'Shorts' %}selected{% endif %}>Shorts</option>
            <option value="Shoes" {% if request.args.get('product_type') == 'Shoes' %}selected{% endif %}>Shoes</option>
            <option value="Bag" {% if request.args.get('product_type') == 'Bag' %}selected{% endif %}>Bag</option>
            <option value="Watch" {% if request.args.get('product_type') == 'Watch' %}selected{% endif %}>Watch</option>
            <option value="Dress" {% if request.args.get('product_type') == 'Dress' %}selected{% endif %}>Dress</option>
            <option value="Other" {% if request.args.get('product_type') == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>

        <!-- Stock Status Filter -->
        <div class="col-md-3">
          <label class="form-label">Stock Status</label>
          <select class="form-select" name="stock">
            <option value="">All</option>
            <option value="In Stock" {% if request.args.get('stock') == 'In Stock' %}selected{% endif %}>In Stock</option>
            <option value="Out of Stock" {% if request.args.get('stock') == 'Out of Stock' %}selected{% endif %}>Out of Stock</option>
          </select>
        </div>

        <!-- Filter Button -->
        <div class="col-md-3 d-grid">
          <button type="submit" class="btn btn-primary">Apply Filters</button>
        </div>

      </div>
    </form>
  </div>

  <!-- ---------- Products Grid ---------- -->
  <div class="row g-4">
    {% for product in products %}
    <div class="col-md-3 col-sm-6">
      <div class="card h-100 shadow-sm hover-shadow">
        {% if product.image_filename %}
          <img src="{{ url_for('static', filename='uploads/' ~ product.image_filename) }}" 
               class="card-img-top" alt="{{ product.name }}">
        {% else %}
          <img src="https://via.placeholder.com/250x200" class="card-img-top" alt="{{ product.name }}">
        {% endif %}
        
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="text-muted">PKR {{ product.price }}</p>
          <p class="card-text small">{{ product.description[:60] }}...</p>
          <a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="btn btn-sm btn-primary mt-auto">Add to Cart</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<!-- ---------- Custom CSS for hover effect ---------- -->
<style>
  .hover-shadow:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    transition: all 0.3s ease-in-out;
  }
</style>
{% endblock %}
